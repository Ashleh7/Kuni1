<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="apple-touch-icon.ico">
</head>

<body>
    <div class="navbar">
        <div class="logo">Kuni</div>
        <div class="menu">
            <a href="about.html">About</a>
            <a href="famous.html">Famous Events</a>
            <a href="index.html">Home</a>
        </div>
        <div class="search">
            <input type="text" placeholder="Search...">
            <button>🔍</button>
        </div>
    </div>
    
    <div class="bts">
        <form>
            <fieldset>
                <legend>Personal details</legend>
                <label>Your name</label><br>
                <input type="text" id="name" placeholder="Enter your full name"><br><br>

                <label>Email Address</label><br>
                <input type="email" id="email" placeholder="Enter your full email"><br><br>
        
                <label>Email Password</label><br>
                <input type="password" id="pass" placeholder="Email password"><br><br>
        
                <label>Confirm Password</label><br>
                <input type="password" id="pass" placeholder="Confirm Password"><br><br>
        
                <label>Phone number</label><br>
                <input type="" id="Phone" placeholder="Enter your Phone number"><br><br>
        
                <label>City</label><br>
                <select id="City">
                    <option value="Auckland">Auckland</option>
                    <option value="Wellington">Wellington</option>
                    <option value="Hamilton">Hamilton</option>
                </select><br><br>
        
                <label>What can we help you with?</label><br>
                <textarea id="notes" rows="3" cols="35" placeholder="Write Reason"></textarea><br>
            </fieldset>
        
            <br>
        
            <fieldset>
                <legend>Preferred Visit Day</legend>
                <input type="checkbox" value="mon"> Monday<br>
                <input type="checkbox" value="wed"> Wednesday<br>
                <input type="checkbox" value="fri"> Friday<br>
            </fieldset>
        
            <br>
        
            <input type="checkbox" value="T&C"> I agree to terms and conditions<br>
            <input type="submit" value="Contact">
            <input type="reset" value="Reset">
        </form>
    </div>


    <footer>
        <p>© 2026 Kuni - Kashvi Gakhar</p>
    </footer>
</body>

</html>
